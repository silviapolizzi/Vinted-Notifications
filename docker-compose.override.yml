# Local development overrides.
#
# Docker Compose loads this file automatically on top of docker-compose.yml:
# it builds the image from this repository instead of pulling the published
# one, and lets you change the host ports (e.g. when 8000 is already in use).
#
#   VN_WEB_PORT=8010 docker compose up -d --build
#
services:
  vinted-notifications:
    build: .
    image: vinted-notifications:local
    pull_policy: missing
    # !override replaces the port list of the base file instead of appending to it
    ports: !override
      - "${VN_WEB_PORT:-8000}:8000"
      - "${VN_RSS_PORT:-8080}:8080"
