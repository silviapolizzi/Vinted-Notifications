services:
  vinted-notifications:
    image: fuyucch1/vinted-notifications:latest
    pull_policy: always
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - VN_data:/app/data
      - VN_logs:/app/logs
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # Chromium uses /dev/shm for its renderer processes
    shm_size: "512mb"

volumes:
  VN_data:
  VN_logs:
