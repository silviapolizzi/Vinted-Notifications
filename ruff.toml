# Ruff configuration.
#
# The rule selection is pinned on purpose: ruff keeps expanding its default
# rule set, and an unpinned CI would start failing on untouched code. If you
# want more rules, add them here together with the fixes.
target-version = "py311"
line-length = 88

[lint]
select = ["E4", "E7", "E9", "F"]
